experiment:
  name: dynamic_rebalance_5nodes

mode: mpi
seed: 42

dataset:
  name: cifar10
  data_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 30
  global_batch_size: 640
  rank_batch_sizes: [384, 64, 48, 48, 96]
  grad_accum:
    enabled: true
    micro_batch_size: 128
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  sync_interval: 20
  sync_tolerance: 0.00001
  drop_remainder: true

dynamic_scheduler:
  enabled: true
  ema_alpha: 0.2
  epsilon: 0.05
  cooldown_epochs: 1
  slowdown_threshold_r: 1.15
  r_min: 0.5
  r_max: 3.0
  lambda_penalty: 1.0

cpu:
  intra_op_threads: 4
  inter_op_threads: 2

gpu:
  num_gpus: 2
  devices: ["/GPU:0", "/GPU:1"]
  strategy: mirrored
  memory_growth: true

logging:
  log_interval: 10
  output_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/results
