# Batch600, H20, Rebalanced: [544, 12, 6, 6, 32] with Cosine Annealing LR Schedule (60 Epochs)
# Extended 60-epoch horizon to evaluate full convergence of HeteroViT Local SGD
experiment:
  name: local_sgd_h20_fp32_cosine_cluster5_rebalance_600_60e_seed42

mode: mpi
seed: 42

dataset:
  name: cifar10
  data_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  comm_precision: fp32
  epochs: 60
  global_batch_size: 600
  auto_balance: false
  rank_batch_sizes:
  - 544
  - 12
  - 6
  - 6
  - 32
  sync_mode: local_sgd
  local_sgd_h: 20
  avg_policy: sample_weighted
  optimizer_state_sync: preserve_local
  grad_accum:
    enabled: false
  optimizer: adamw
  learning_rate: 0.001
  lr_schedule: cosine          # Cosine Annealing decay across 60 epochs (4500 steps)
  min_lr_ratio: 0.01           # Minimum LR = 1e-5
  weight_decay: 0.0001
  sync_interval: 20
  sync_tolerance: 1.0e-05
  drop_remainder: true
  repeat_dataset: true

cpu:
  intra_op_threads: 4
  inter_op_threads: 2

gpu:
  num_gpus: 2
  devices:
  - /GPU:0
  - /GPU:1
  strategy: mirrored
  memory_growth: true

logging:
  log_interval: 10
  output_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/results
  round_diagnostic: true
