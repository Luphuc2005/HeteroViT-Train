experiment:
  name: adaptive_v3_primal_dual_300_40e_seed42

mode: mpi
seed: 42

dataset:
  name: cifar10
  data_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 40
  global_batch_size: 300
  auto_balance: true
  sync_mode: local_sgd
  local_sgd_policy: pdca_h
  avg_policy: sample_weighted
  optimizer_state_sync: preserve_local
  adaptive_h:
    type: pdca_h
    candidates: [40, 80, 120, 150]
    initial_h: 40
    risk_budget: 0.003
    dual_step_size: 500.0
    dual_initial: 0.0
    dual_max: 50.0
    metric_type: normalized_q
    weighting_mode: step_weighted
    fallback_exponent: 2.0
    forgetting_factor: 0.98
    uncertainty_multiplier: 1.0
    min_distinct_h: 2
    min_observations: 3
    adjacent_step_only: true
    epoch_aware_cost: true
    cost_ema_alpha: 0.2
    epsilon: 1.0e-12
  grad_accum:
    enabled: false
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  sync_interval: 20
  sync_tolerance: 0.00001
  drop_remainder: true

cpu:
  intra_op_threads: 4
  inter_op_threads: 2

gpu:
  num_gpus: 2
  devices: ["/GPU:0", "/GPU:1"]
  strategy: mirrored
  memory_growth: true

logging:
  log_interval: 10
  output_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/results

