experiment:
  name: mpi_baseline_5nodes

mode: mpi

seed: 42

dataset:
  name: cifar10
  data_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 20
  batch_size: 128         # Local batch size per MPI rank (Global batch = 128 * 5 = 640)
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  sync_interval: 20       # Verify grad and weight synchronization every 20 steps
  sync_tolerance: 0.00001 # 1e-5 tolerance for synchronization verification
  drop_remainder: true    # Drop partial last batch to ensure identical steps per epoch

cpu:
  intra_op_threads: 4
  inter_op_threads: 2

gpu:
  num_gpus: 2
  devices: ["/GPU:0", "/GPU:1"]
  strategy: mirrored
  memory_growth: true

logging:
  log_interval: 10
  output_dir: /home/icip/Ha/HeteroViT-Project/HeteroViT-MPI/results

