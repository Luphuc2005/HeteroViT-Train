experiment:
  name: gpu_2titanz_c4_b256_20e

mode: gpu

seed: 42

dataset:
  name: cifar10
  data_dir: ./data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 20
  batch_size: 256          # Global batch = 256 (mỗi GPU nhận 128)
  per_gpu_batch_size: 128
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

cpu:
  physical_cores: 4        # CPU loader: 4 cores
  intra_op_threads: 4
  inter_op_threads: 2

gpu:
  num_gpus: 2
  devices: ["/GPU:0", "/GPU:1"]
  strategy: mirrored
  memory_growth: true

logging:
  log_interval: 50
  output_dir: ./results/gpu_multi_benchmarks/run3_c4_b256
