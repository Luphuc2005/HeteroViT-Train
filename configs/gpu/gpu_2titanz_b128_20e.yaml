experiment:
  name: gpu_2titanz_b128_20e

mode: gpu

seed: 42

dataset:
  name: cifar10
  data_dir: ./data/cifar10
  num_classes: 10

model:
  name: vit_tiny
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 20
  batch_size: 128         # Global batch size = 128 (giữ nguyên so với 1 GPU để đo Strong Scaling)
  per_gpu_batch_size: 64  # Mỗi GPU Titan Z nhận 64 samples
  optimizer: adamw
  learning_rate: 0.001    # Giữ nguyên LR do global batch size không đổi
  weight_decay: 0.0001

gpu:
  num_gpus: 2
  devices: ["/GPU:0", "/GPU:1"]
  strategy: mirrored      # tf.distribute.MirroredStrategy cho 2 GPU Titan Z
  memory_growth: true     # Bật để tối ưu VRAM (Titan Z có 6GB VRAM/GPU)

logging:
  log_interval: 50
  output_dir: ./results/gpu_multi_benchmarks/b128
